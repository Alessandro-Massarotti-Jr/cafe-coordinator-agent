services:
  backend:
    build:
      context: ./backend
      dockerfile: ./.docker/Dockerfile.dev
    command: "/home/node/app/.docker/start-infra.sh"
    container_name: backend
    environment:
      - PORT=3000
      - OLLAMA_URL=http://ollama:11434/api
    volumes:
      - ./backend:/home/node/app:cached
    expose:
      - "3000"
    depends_on:
      - ollama
      - qdrant
      - products-mcp

  products-mcp:
    build:
      context: ./products-mcp
      dockerfile: ./.docker/Dockerfile.dev
    container_name: products-mcp
    environment:
      - PORT=3001
    volumes:
      - ./products-mcp:/home/node/app:cached
    expose:
      - "3001"

  frontend-chat:
    build:
      context: ./frontend-chat
      dockerfile: ./.docker/Dockerfile
    container_name: frontend-chat
    ports:
      - "3001:80"
    volumes:
      - ./frontend-chat/public:/usr/share/nginx/html
      - ./frontend-chat/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  frontend-atendente:
    build:
      context: ./frontend-atendente
      dockerfile: ./.docker/Dockerfile
    container_name: frontend-atendente
    ports:
      - "3002:80"
    volumes:
      - ./frontend-atendente/public:/usr/share/nginx/html
      - ./frontend-atendente/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:0.40.3
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      /bin/sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull gemma4 &&
      ollama pull embeddinggemma &&
      wait
      "
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  ollama_data:
  qdrant_data:
